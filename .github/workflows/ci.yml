name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: neurallayer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neurallayer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-postgres@127.0.0.1:5432/neurallayer
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install --global corepack@0.34.5 --force
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm db:migrate
      - run: corepack pnpm db:seed
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
